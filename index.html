<!DOCTYPE html>
<html lang="en">
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunset Sunrise Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="gradient">
    <header>
        <h1>Sunset Sunrise Dashboard</h1>
        <p>Track sunrise and sunset times for today and tomorrow</p>
    </header>
    <main>
        <section>
            <h2>Select location to see sunrise and sunset times</h2>
            <select name="locations" id="location-selector">
                <option value="">--Select a location--</option>
                <option value="newyork">New York</option>
                <option value="losangeles">Los Angeles</option>
                <option value="chicago">Chicago</option>
                <option value="houston">Houston</option>
                <option value="miami">Miami</option>
                <option value="seattle">Seattle</option>
                <option value="denver">Denver</option>
                <option value="boston">Boston</option>
                <option value="sanfrancisco">San Francisco</option>
                <option value="atlanta">Atlanta</option>
            </select>
            <table>
                <tr><th></th><th>Today</th><th>Tomorrow</th></tr>
                <tr><td>Sunrise</td><td id="sunrise-today">--:--</td><td id="sunrise-tomorrow">--:--</td></tr>
                <tr><td>Sunset</td><td id="sunset-today">--:--</td><td id="sunset-tomorrow">--:--</td></tr>
                <tr><td>Dawn</td><td id="dawn-today">--:--</td><td id="dawn-tomorrow">--:--</td></tr>
                <tr><td>Dusk</td><td id="dusk-today">--:--</td><td id="dusk-tomorrow">--:--</td></tr>
                <tr><td>Solar Noon</td><td id="solarnoon-today">--:--</td><td id="solarnoon-tomorrow">--:--</td></tr>
            </table>
        </section>
    </main>
    <footer>
        <p></p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
