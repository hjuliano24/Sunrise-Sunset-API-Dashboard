<!DOCTYPE html>
<html lang="en">
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunset Sunrise Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Playwrite+NO:wght@100..400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Sunset Sunrise Dashboard</h1>
        <p>Track sunrise and sunset times for today and tomorrow</p>
    </header>
    <main>
        <section>
            <h2>Select location to see sunrise and sunset times</h2>
            <select name="locations" id="locationSelector">
                <option value="">--Select a location--</option>
                <!-- Add if time permits 
                <option value="currentLocation">Current Location</option>
                -->
                <option value="newYork">New York</option>
                <option value="losAngeles">Los Angeles</option>
                <option value="chicago">Chicago</option>
                <option value="houston">Houston</option>
                <option value="miami">Miami</option>
                <option value="seattle">Seattle</option>
                <option value="denver">Denver</option>
                <option value="boston">Boston</option>
                <option value="sanfrancisco">San Francisco</option>
                <option value="atlanta">Atlanta</option>
            </select>
            <p id="errorMessage"></p>
            <table>
                <tr><th></th><th>Today</th><th>Tomorrow</th></tr>
                <tr><td>Sunrise</td><td id="sunriseToday">--:--</td><td id="sunriseTomorrow">--:--</td></tr>
                <tr><td>Sunset</td><td id="sunsetToday">--:--</td><td id="sunsetTomorrow">--:--</td></tr>
                <tr><td>Dawn</td><td id="dawnToday">--:--</td><td id="dawnTomorrow">--:--</td></tr>
                <tr><td>Dusk</td><td id="duskToday">--:--</td><td id="duskTomorrow">--:--</td></tr>
                <tr><td>Solar Noon</td><td id="solarNoonToday">--:--</td><td id="solarNoonTomorrow">--:--</td></tr>
            </table>
        </section>
    </main>
    <footer>
        <p>Powered by <a href="https://sunrisesunset.io/" target="_blank">Sunrise Sunset API</a></p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
